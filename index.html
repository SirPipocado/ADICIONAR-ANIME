<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adicionar Anime</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  margin: 0;
  padding: 30px;
}

h1 {
  text-align: center;
  margin-top: 0;
  margin-bottom: 25px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 16px;
}

.field-label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
}

input[type="text"],
input[type="number"],
textarea {
  width: 100%;
  padding: 10px;

  border-radius: 8px;
  border: 1px solid #334155;

  background: #0f172a;
  color: white;

  outline: none;
}

input[type="text"]:focus,
input[type="number"]:focus,
textarea:focus {
  border-color: #3b82f6;
}

input[type="checkbox"] {
  width: 16px;
  height: 16px;

  margin: 0;

  flex: 0 0 16px;

  accent-color: #3b82f6;
  cursor: pointer;
}

.checks {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;

  margin-top: 10px;
}

.check-option {
  min-height: 36px;

  display: flex;
  align-items: center;
  gap: 9px;

  margin: 0;

  padding: 8px 10px;

  border: 1px solid #334155;
  border-radius: 8px;

  background: #172033;

  font-weight: normal;
  font-size: 14px;

  cursor: pointer;
  user-select: none;

  transition:
    background 0.15s ease,
    border-color 0.15s ease;
}

.check-option:hover {
  background: #243147;
}

.check-option:has(input:checked) {
  background: rgba(59, 130, 246, 0.15);
  border-color: rgba(96, 165, 250, 0.55);
}

.generos {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 8px;

  margin-top: 10px;
}

.generos .check-option {
  width: 100%;
}

.botoes {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  margin-top: 20px;

  padding: 12px 18px;

  border: none;
  border-radius: 8px;

  cursor: pointer;

  font-weight: bold;

  background: #3b82f6;
  color: white;

  transition: background 0.15s ease;
}

button:hover {
  background: #2563eb;
}

#resultado {
  margin-top: 20px;

  min-height: 300px;

  font-family: Consolas, monospace;

  resize: vertical;
}

  .preview-container {
  display: none;

  margin-top: 12px;

  width: 180px;

  border: 1px solid #334155;
  border-radius: 12px;

  overflow: hidden;

  background: #0f172a;

  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
}

.preview-container.ativo {
  display: block;
}

#previewImagem {
  display: block;

  width: 100%;
  aspect-ratio: 2 / 3;

  object-fit: cover;
}

@media (max-width: 600px) {

  body {
    padding: 15px;
  }

  .container {
    padding: 18px;
  }

  .generos {
    grid-template-columns: 1fr;
  }

}

</style>
</head>


<body>

<h1>➕ Adicionar Anime</h1>

<div class="container">


  <label class="field-label">Nome</label>
  <input id="nome" type="text">


  <label class="field-label">Nota IMDB</label>
  <input
    id="imdb"
    type="number"
    step="0.1"
    min="0"
    max="10"
    value="0"
  >


  <label class="field-label">Nota MyAnimeList</label>
  <input
    id="myAnimeList"
    type="number"
    step="0.1"
    min="0"
    max="10"
    value="0"
  >


  <label class="field-label">Status</label>

  <div class="checks">

    <label class="check-option">
      <input type="checkbox" id="dublado">
      <span>Dublado</span>
    </label>

    <label class="check-option">
      <input type="checkbox" id="emLancamento">
      <span>Em lançamento</span>
    </label>

  </div>


  <label class="field-label">
    Total de episódios
  </label>

  <input
    id="epsTotais"
    type="number"
    min="0"
    value="12"
  >


 <label class="field-label">
  Link da imagem
</label>

<input
  id="img"
  type="text"
  placeholder="Cole o link da imagem..."
>

<div class="preview-container" id="previewContainer">
  <img
    id="previewImagem"
    alt="Prévia da imagem"
  >
</div>


  <label class="field-label">
    Gêneros
  </label>


  <div class="generos">

    <label class="check-option">
      <input type="checkbox" class="genero" value="1">
      <span>Romance</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="2">
      <span>Ação</span>
    </label>


    <label class="check-option">
      <input type="checkbox" class="genero" value="3">
      <span>Ecchi</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="4">
      <span>Comédia</span>
    </label>


    <label class="check-option">
      <input type="checkbox" class="genero" value="5">
      <span>Isekai</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="6">
      <span>Drama</span>
    </label>


    <label class="check-option">
      <input type="checkbox" class="genero" value="7">
      <span>Fantasia</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="8">
      <span>Sci-Fi</span>
    </label>


    <label class="check-option">
      <input type="checkbox" class="genero" value="9">
      <span>Slice of Life</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="10">
      <span>Shounen</span>
    </label>


    <label class="check-option">
      <input type="checkbox" class="genero" value="11">
      <span>Aventura</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="12">
      <span>Sobrenatural</span>
    </label>


    <label class="check-option">
      <input type="checkbox" class="genero" value="13">
      <span>Mistério</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="14">
      <span>Psicológico</span>
    </label>


    <label class="check-option">
      <input type="checkbox" class="genero" value="15">
      <span>Harem</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="16">
      <span>Terror</span>
    </label>


    <label class="check-option">
      <input type="checkbox" class="genero" value="17">
      <span>Mecha</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="18">
      <span>Esportes</span>
    </label>


    <label class="check-option">
      <input type="checkbox" class="genero" value="19">
      <span>Música</span>
    </label>

    <label class="check-option">
      <input type="checkbox" class="genero" value="20">
      <span>Escolar</span>
    </label>

  </div>


  <div class="botoes">

    <button onclick="gerarAnime()">
      ⚙️ Gerar Anime
    </button>

    <button onclick="copiarAnime()">
      📋 Copiar
    </button>

  </div>


  <textarea
    id="resultado"
    readonly
  ></textarea>


</div>


<script>

function textoSeguro(texto) {
  return JSON.stringify(texto);
}

  const inputImagem =
  document.getElementById("img");

const previewContainer =
  document.getElementById("previewContainer");

const previewImagem =
  document.getElementById("previewImagem");


inputImagem.addEventListener("input", () => {

  const url =
    inputImagem.value.trim();

  if (!url) {

    previewContainer.classList.remove("ativo");

    previewImagem.removeAttribute("src");

    return;
  }

  previewImagem.src = url;
});


previewImagem.addEventListener("load", () => {

  previewContainer.classList.add("ativo");

});


previewImagem.addEventListener("error", () => {

  previewContainer.classList.remove("ativo");

});

function gerarAnime() {

  const nome =
    document.getElementById("nome").value;


  const imdb =
    parseFloat(
      document.getElementById("imdb").value
    ) || 0;


  const myAnimeList =
    parseFloat(
      document.getElementById("myAnimeList").value
    ) || 0;


  const dublado =
    document.getElementById("dublado").checked;


  const emLancamento =
    document.getElementById("emLancamento").checked;


  const totais =
    document.getElementById("epsTotais").value || 0;


  const img =
    document.getElementById("img").value;


  const generos =
    [...document.querySelectorAll(".genero:checked")]
      .map(g => g.value)
      .join(", ");


  const resultado =
`{
  nome: ${textoSeguro(nome)},
  nota: null,
  imdb: ${imdb.toFixed(1)},
  MyAnimeList: ${myAnimeList.toFixed(1)},
  dublado: ${dublado},
  finalizado: false,
  emLancamento: ${emLancamento},
  dropado: false,
  brutal: false,
  eps: "0/${totais}",
  img: ${textoSeguro(img)},
  desc: "???",
  genre: "${generos}"
},`;


  document.getElementById("resultado").value =
    resultado;
}


function copiarAnime() {

  const resultado =
    document.getElementById("resultado");


  if (!resultado.value) {
    gerarAnime();
  }


  navigator.clipboard
    .writeText(resultado.value)
    .then(() => {
      alert("Anime copiado! 🍿");
    });

}

</script>

</body>
</html>
