<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Adicionar Anime</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  margin: 0;
  padding: 30px;
}

h1 {
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 16px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #334155;
  background: #0f172a;
  color: white;
}

.checks {
  display: flex;
  flex-wrap: wrap;
  gap: 25px;
  margin-top: 10px;
}

.checks label {
  margin: 0;
  font-weight: normal;
}

.generos {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.generos label {
  margin: 0;
  font-weight: normal;
}

button {
  margin-top: 20px;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  background: #3b82f6;
  color: white;
}

button:hover {
  background: #2563eb;
}

#resultado {
  margin-top: 20px;
  min-height: 300px;
  font-family: Consolas, monospace;
}
</style>
</head>

<body>

<h1>➕ Adicionar Anime</h1>

<div class="container">

  <label>Nome</label>
  <input id="nome">

  <label>Nota IMDB</label>
  <input id="imdb" type="number" step="0.1" value="0">

  <label>Status</label>

  <div class="checks">
    <label>
      <input type="checkbox" id="dublado">
      Dublado
    </label>

    <label>
      <input type="checkbox" id="emLancamento">
      Em lançamento
    </label>
  </div>

  <label>Total de episódios</label>
  <input id="epsTotais" type="number" value="12">

  <label>Quantidade de temporadas</label>
  <input id="qtdTemporadas" type="number" min="0" value="0">

  <label>Quantidade de filmes</label>
  <input id="qtdFilmes" type="number" min="0" value="0">

  <label>Link da imagem</label>
  <input id="img">

  <label>Gêneros</label>

  <div class="generos">
    <label><input type="checkbox" class="genero" value="1"> Romance</label>
    <label><input type="checkbox" class="genero" value="2"> Ação</label>

    <label><input type="checkbox" class="genero" value="3"> Ecchi</label>
    <label><input type="checkbox" class="genero" value="4"> Comédia</label>

    <label><input type="checkbox" class="genero" value="5"> Isekai</label>
    <label><input type="checkbox" class="genero" value="6"> Drama</label>

    <label><input type="checkbox" class="genero" value="7"> Fantasia</label>
    <label><input type="checkbox" class="genero" value="8"> Sci-Fi</label>

    <label><input type="checkbox" class="genero" value="9"> Slice of Life</label>
    <label><input type="checkbox" class="genero" value="10"> Shounen</label>
  </div>

  <button onclick="gerarAnime()">⚙️ Gerar Anime</button>
  <button onclick="copiarAnime()">📋 Copiar</button>

  <textarea id="resultado" readonly></textarea>

</div>

<script>

function textoSeguro(texto) {
  return JSON.stringify(texto);
}

function gerarAnime() {

  const nome = document.getElementById("nome").value;

  const imdb =
    parseFloat(document.getElementById("imdb").value) || 0;

  const dublado =
    document.getElementById("dublado").checked;

  const emLancamento =
    document.getElementById("emLancamento").checked;

  const totais =
    document.getElementById("epsTotais").value || 0;

  const qtdTemporadas =
    parseInt(document.getElementById("qtdTemporadas").value) || 0;

  const qtdFilmes =
   parseInt(document.getElementById("qtdFilmes").value) || 0;

  const img =
    document.getElementById("img").value;

  const generos =
    [...document.querySelectorAll(".genero:checked")]
      .map(g => g.value)
      .join(", ");

  let extras = "";

if (qtdTemporadas > 0) {
  const temporadas = [];

  for (let i = 1; i <= qtdTemporadas; i++) {
    temporadas.push(
      `    { nome: "${i}ª Temporada", nota: null }`
    );
  }

  extras += `,

  temporadas: [
${temporadas.join(",\n")}
  ]`;
}

if (qtdFilmes > 0) {
  const filmes = [];

  for (let i = 1; i <= qtdFilmes; i++) {
    filmes.push(
      `    { nome: "Filme ${i}", nota: null }`
    );
  }

  extras += `,

  filmesNotas: [
${filmes.join(",\n")}
  ]`;
}

  const resultado =
`{
  nome: ${textoSeguro(nome)},
  nota: null,
  imdb: ${imdb.toFixed(1)},
  dublado: ${dublado},
  finalizado: false,
  emLancamento: ${emLancamento},
  dropado: false,
  brutal: false,
  eps: "0/${totais}",
  img: ${textoSeguro(img)},
  desc: "???",
  genre: "${generos}"${extras}
},`;

  document.getElementById("resultado").value = resultado;
}

function copiarAnime() {

  const resultado =
    document.getElementById("resultado");

  if (!resultado.value) {
    gerarAnime();
  }

  navigator.clipboard
    .writeText(resultado.value)
    .then(() => {
      alert("Anime copiado! 🍿");
    });

}

</script>

</body>
</html>
